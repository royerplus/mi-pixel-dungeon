multiplayer.mp.dm_help=Controlas a los enemigos de la mazmorra. Al principio ves todo el piso como espectador. _Toca un enemigo_ para convertirte en él: tendrás sus características y decidirás cómo se mueve y ataca.\n\nToca una casilla para caminar hacia ella, toca al héroe para atacarlo cuando esté a tu alcance y toca a tu criatura para esperar un turno. Mientras tu criatura siga viva, la única forma de cambiar a otro enemigo es el _bastón de intercambio_. Si muere, vuelves a ser espectador y puedes elegir otro.\n\nSi tardas demasiado, tu criatura actúa sola ese turno.
